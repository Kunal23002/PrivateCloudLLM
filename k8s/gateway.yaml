apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: privatecloudllm
data:
  VLLM_URL: "http://vllm-mock:8001"
  REDIS_URL: "redis://redis:6379/0"
  MEMORY_TOP_K: "3"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: privatecloudllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: privatecloudllm/gateway:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: gateway-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: privatecloudllm
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
