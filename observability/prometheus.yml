global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: privatecloudllm-gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
